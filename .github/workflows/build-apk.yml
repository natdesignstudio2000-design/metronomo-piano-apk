name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: ${{ github.workspace }}/android.keystore
      KEYSTORE_PASSWORD: android
      KEY_ALIAS: android
      KEY_PASSWORD: android

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;34.0.0 platforms;android-34 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Copy offline web app into the APK assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R native/www/. android/app/src/main/assets/www/
          ls -R android/app/src/main/assets/www

      - name: Prepare launcher icons
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$d"
            cp public/icon-512.png "android/app/src/main/res/$d/ic_launcher.png"
          done

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Metronomo Piano, OU=Natdesign, O=Natdesign, L=Caracas, ST=DC, C=VE"

      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          find android/app/build/outputs/apk -name "*.apk" -print
          cp android/app/build/outputs/apk/release/app-release.apk metronomo-offline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metronomo-apk
          path: metronomo-offline.apk
          if-no-files-found: error

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: metronomo-keystore
          path: android.keystore
          if-no-files-found: error
